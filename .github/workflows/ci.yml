# Build and audit on every push to main and every pull request
# (new advisories between pushes come from Dependabot alerts).
# Actions are pinned to commit SHAs (tag in the comment) so a moved tag cannot change what runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          check-latest: true # the runner's cached 22.x can be older than Astro's minimum
          cache: pnpm

      - name: Install (lockfile only; build scripts per allowBuilds)
        run: pnpm install --frozen-lockfile

      - name: Type check and build
        run: pnpm run build

      - name: Audit dependencies
        run: pnpm audit
