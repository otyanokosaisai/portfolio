# Do not install a version until it has been public for 1 day (minutes):
# hijacked releases are usually pulled within hours.
minimumReleaseAge: 1440

# Build scripts of dependencies run only when set to true here.
# esbuild and sharp ship prebuilt binaries, so their scripts are not needed.
allowBuilds:
  esbuild: false
  sharp: false

# Patched versions of transitive dependencies with advisories.
overrides:
  "postcss-selector-parser@<6.1.5": "^6.1.5"
